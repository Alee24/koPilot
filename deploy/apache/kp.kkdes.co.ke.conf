<VirtualHost *:80>
    ServerName kp.kkdes.co.ke
    DocumentRoot /var/www/kopilot-acme

    <Directory /var/www/kopilot-acme>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ /var/www/kopilot-acme/.well-known/acme-challenge/
    <Location "/.well-known/acme-challenge/">
        ProxyPass "!"
    </Location>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8440/
    ProxyPassReverse / http://127.0.0.1:8440/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/kp.kkdes.co.ke_error.log
    CustomLog ${APACHE_LOG_DIR}/kp.kkdes.co.ke_access.log combined
</VirtualHost>
